# Optional details for each mini, keyed by photo file name (without extension).
#
# Every photo in photos/ shows up automatically, newest first. Add a section
# here only when you want to give a mini a name and/or description, or tweak
# how it is shown. All fields are optional:
#
#   name        = "Mimic"
#   description = "Markdown-lite: [links](https://example.com), bare URLs, *italic*, **bold**."
#   order       = 1        # pin to a position (lower comes first)
#   sticker     = false    # leave it out of the sticker playground
#   hidden      = true     # leave it out entirely
#
# Example:
#
# [DSC_8855]
# name = "Mimic"
# description = """
# Sculpt by [Someone](https://example.com). Painted November 2026.
# """
