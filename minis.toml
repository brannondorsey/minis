# Optional details for your minis.
#
# Every photo in photos/ shows up in the gallery automatically. To group
# several photos of the same model, list them in a [[mini]] entry: they sit
# together in the gallery, and the model gets a single sticker, cut from its
# first photo.
#
# Order: the gallery follows this file, top to bottom. Photos not listed here
# yet come first, newest first. Add new minis at the top.
#
# Fields (all optional except photos):
#
#   photos      = ["DSC_8855", "DSC_8859"]   # file names, without extension
#   name        = "Mimic"
#   description = "Markdown-lite: [links](https://example.com), bare URLs, *italic*, **bold**."
#   sticker     = "DSC_8859"   # cut the sticker from another of its photos
#   sticker     = false        # no sticker for this one
#   hidden      = true         # leave it out entirely

